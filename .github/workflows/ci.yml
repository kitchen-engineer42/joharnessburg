name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib test suite
        working-directory: plugins/joharnessburg
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check generated Codex agents
        run: python plugins/joharnessburg/scripts/sync_codex_agents.py --check
      - name: Validate JSON declarations
        run: |
          python -m json.tool plugins/joharnessburg/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/joharnessburg/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/joharnessburg/hooks/hooks.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
      - name: Check shell syntax
        run: bash -n plugins/joharnessburg/templates/apply.sh
